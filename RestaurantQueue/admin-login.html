<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบแอดมิน</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg,#667eea,#764ba2);
    padding: 20px;
}

.login-box {
    width: 400px;
    max-width: 100%;
    background: white;
    padding: 35px;
    border-radius: 25px;
    box-shadow: 0 15px 35px rgba(0,0,0,.3);
}

h1 {
    text-align: center;
    color: #6c5ce7;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #6c5ce7;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

button:disabled {
    background: #aaa;
}

#error {
    color: #e74c3c;
    text-align: center;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="login-box">

    <h1>🔐 แอดมิน</h1>

    <div class="subtitle">
        ระบบจัดการคิวร้านอาหาร
    </div>

    <label>อีเมล</label>

    <input
        type="email"
        id="email"
        placeholder="admin@example.com"
    >

    <label>รหัสผ่าน</label>

    <input
        type="password"
        id="password"
        placeholder="รหัสผ่าน"
    >

    <button id="loginButton">
        🔑 เข้าสู่ระบบ
    </button>

    <div id="error"></div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyCinwLrAnugbxn2X60C8qTqBHWNDXzHB7c",

    authDomain:
        "restaurantqueue-80705.firebaseapp.com",

    databaseURL:
        "https://restaurantqueue-80705-default-rtdb.firebaseio.com",

    projectId:
        "restaurantqueue-80705",

    storageBucket:
        "restaurantqueue-80705.firebasestorage.app",

    messagingSenderId:
        "944772230709",

    appId:
        "1:944772230709:web:8a73bee17f067c8c48cb7c",

    measurementId:
        "G-8NK846F8XE"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const errorBox =
    document.getElementById("error");


async function login() {

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    errorBox.innerText = "";


    if (!email) {

        errorBox.innerText =
            "กรุณากรอกอีเมล";

        return;
    }


    if (!password) {

        errorBox.innerText =
            "กรุณากรอกรหัสผ่าน";

        return;
    }


    loginButton.disabled = true;

    loginButton.innerText =
        "กำลังเข้าสู่ระบบ...";


    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        // สำเร็จ → ไปหน้าแอดมิน
        window.location.replace(
            "admin.html"
        );

    }

    catch (error) {

        console.error(error);

        if (
            error.code ===
            "auth/invalid-credential"
        ) {

            errorBox.innerText =
                "❌ อีเมลหรือรหัสผ่านไม่ถูกต้อง";

        }

        else if (
            error.code ===
            "auth/invalid-email"
        ) {

            errorBox.innerText =
                "❌ รูปแบบอีเมลไม่ถูกต้อง";

        }

        else {

            errorBox.innerText =
                "❌ เข้าสู่ระบบไม่สำเร็จ: " +
                error.message;

        }

        loginButton.disabled = false;

        loginButton.innerText =
            "🔑 เข้าสู่ระบบ";
    }

}


loginButton.addEventListener(
    "click",
    login
);


// กด Enter เพื่อ Login
passwordInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            login();

        }

    }
);

</script>

</body>
</html>
