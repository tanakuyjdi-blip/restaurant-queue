<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>จองคิว</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 25px 15px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .back {
            display: inline-block;
            background: white;
            color: #333;
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .shop-icon {
            text-align: center;
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        .current-box {
            margin-top: 25px;
            background: #f5f5f5;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .current-label {
            color: #777;
            margin-bottom: 8px;
        }

        .current-number {
            font-size: 40px;
            font-weight: bold;
            color: #667eea;
        }

        .result {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            background: #e8f5e9;
            text-align: center;
        }

        .result h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .my-queue {
            font-size: 45px;
            font-weight: bold;
            color: #2e7d32;
        }

        @media (max-width: 600px) {

            .card {
                padding: 20px;
            }

        }

    </style>
</head>


<body>

<div class="container">

    <a href="index.html" class="back">
        ← กลับหน้าหลัก
    </a>


    <div class="card">

        <div class="shop-icon" id="shopIcon">
            ☕
        </div>


        <h1 id="shopName">
            ร้านน้ำคาเฟ่
        </h1>


        <p class="description" id="shopDescription">
            เครื่องดื่มและของหวาน
        </p>


        <!-- ชื่อลูกค้า -->
        <label for="customerName">
            ชื่อลูกค้า
        </label>

        <input
            type="text"
            id="customerName"
            placeholder="กรอกชื่อของคุณ"
        >


        <!-- ปุ่มรับคิว -->
        <button onclick="getQueue()">
            🎫 รับบัตรคิว
        </button>


        <!-- คิวปัจจุบัน -->
        <div class="current-box">

            <div class="current-label">
                คิวปัจจุบัน
            </div>

            <div
                class="current-number"
                id="currentNumber"
            >
                A000
            </div>

        </div>


        <!-- ผลลัพธ์คิว -->
        <div class="result" id="result">

            <h2>
                รับคิวสำเร็จ 🎉
            </h2>

            <p>
                หมายเลขคิวของคุณคือ
            </p>

            <div
                class="my-queue"
                id="myQueue"
            >
                A001
            </div>

        </div>

    </div>

</div>


<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
        getDatabase,
        ref,
        onValue,
        push,
        set,
        get
    }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    // =========================
    // Firebase
    // =========================

    const firebaseConfig = {
        apiKey: "AIzaSyCinwLrAnugbxn2X60C8qTQbHWNDXzHB7c",
        authDomain: "restaurantqueue-80705.firebaseapp.com",
        databaseURL: "https://restaurantqueue-80705-default-rtdb.firebaseio.com",
        projectId: "restaurantqueue-80705",
        storageBucket: "restaurantqueue-80705.firebasestorage.app",
        messagingSenderId: "944772230709",
        appId: "1:944772230709:web:8a73bee17f067c8c48cb7c",
        measurementId: "G-8NK846F8XE"
    };


    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);


    // =========================
    // ตรวจว่ามาจากร้านไหน
    // =========================

    const params = new URLSearchParams(
        window.location.search
    );

    const shop = params.get("shop") || "A";


    // =========================
    // ตั้งค่าร้าน
    // =========================

    if (shop === "A") {

        document.getElementById("shopIcon").textContent = "☕";

        document.getElementById("shopName").textContent =
            "ร้านน้ำคาเฟ่";

        document.getElementById("shopDescription").textContent =
            "เครื่องดื่มและของหวาน";

    }


    if (shop === "B") {

        document.getElementById("shopIcon").textContent = "🌶️";

        document.getElementById("shopName").textContent =
            "ร้านหม่าล่า";

        document.getElementById("shopDescription").textContent =
            "หม่าล่าและของย่าง";

    }


    // =========================
    // แสดงคิวปัจจุบันแบบ Real-time
    // =========================

    const currentRef = ref(
        db,
        "current/" + shop
    );


    onValue(currentRef, (snapshot) => {

        const data = snapshot.val() || {};

        const number = Number(
            data.number || 0
        );


        document.getElementById(
            "currentNumber"
        ).textContent =
            shop + String(number).padStart(3, "0");

    });


    // =========================
    // รับคิว
    // =========================

    window.getQueue = async function() {

        const customerName =
            document.getElementById(
                "customerName"
            ).value.trim();


        if (customerName === "") {

            alert("กรุณากรอกชื่อลูกค้า");

            return;
        }


        try {

            // อ่านเลขคิวล่าสุด
            const counterRef = ref(
                db,
                "counters/" + shop
            );

            const snapshot =
                await get(counterRef);


            let nextNumber = 1;


            if (snapshot.exists()) {

                nextNumber =
                    Number(snapshot.val()) + 1;

            }


            // บันทึกเลขคิวล่าสุด
            await set(
                counterRef,
                nextNumber
            );


            // สร้างหมายเลขคิว
            const queueNumber =
                shop +
                String(nextNumber).padStart(3, "0");


            // บันทึกข้อมูลลูกค้า
            const queueRef = push(
                ref(
                    db,
                    "queues/" + shop
                )
            );


            await set(
                queueRef,
                {
                    name: customerName,
                    number: nextNumber,
                    queue: queueNumber,
                    status: "waiting",
                    createdAt: Date.now()
                }
            );


            // แสดงผล
            document.getElementById(
                "myQueue"
            ).textContent = queueNumber;


            document.getElementById(
                "result"
            ).style.display = "block";


            // ล้างชื่อ
            document.getElementById(
                "customerName"
            ).value = "";


        } catch (error) {

            console.error(error);

            alert(
                "เกิดข้อผิดพลาดในการรับคิว\n" +
                error.message
            );

        }

    };

</script>

</body>
</html>
