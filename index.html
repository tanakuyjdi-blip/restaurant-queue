<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ระบบจองคิวร้านอาหาร</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            padding: 20px;

        }


        .container {

            width: 900px;

            max-width: 100%;

            margin: auto;

        }


        h1 {

            color: white;

            text-align: center;

            margin-bottom: 25px;

        }


        /* =========================
           เลือกร้าน
        ========================= */

        .shops {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;

        }


        .shop {

            background: white;

            padding: 25px;

            border-radius: 20px;

            text-align: center;

            cursor: pointer;

            border: 4px solid transparent;

            transition: 0.2s;

        }


        .shop:hover {

            transform: translateY(-3px);

        }


        .shop.active {

            border-color:
                #6c5ce7;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.15);

        }


        .shop-icon {

            font-size: 50px;

        }


        .shop h2 {

            margin: 10px 0;

        }


        /* =========================
           กล่อง
        ========================= */

        .box {

            background: white;

            margin-top: 20px;

            padding: 25px;

            border-radius: 20px;

        }


        .selected {

            text-align: center;

            color: #6c5ce7;

        }


        /* =========================
           คิวปัจจุบัน
        ========================= */

        .current {

            text-align: center;

        }


        #currentQueue {

            font-size: 65px;

            font-weight: bold;

            color: #764ba2;

            margin-top: 10px;

        }


        /* =========================
           ชื่อลูกค้า
        ========================= */

        input {

            width: 100%;

            padding: 15px;

            margin-top: 15px;

            border:
                1px solid #ddd;

            border-radius: 10px;

            font-size: 17px;

        }


        /* =========================
           ปุ่มรับคิว
        ========================= */

        button {

            width: 100%;

            padding: 15px;

            margin-top: 15px;

            border: none;

            border-radius: 10px;

            color: white;

            font-size: 18px;

            cursor: pointer;

        }


        .book-btn {

            background:
                #6c5ce7;

        }


        .book-btn:hover {

            background:
                #5849d6;

        }


        /* =========================
           รายการคิว
        ========================= */

        table {

            width: 100%;

            margin-top: 15px;

            border-collapse:
                collapse;

        }


        th,
        td {

            padding: 12px;

            border-bottom:
                1px solid #ddd;

            text-align: center;

        }


        th {

            background:
                #f3e8ff;

        }


        /* =========================
           สถานะ
        ========================= */

        .status-box {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;

        }


        .status-shop {

            background:
                #f5f5f5;

            padding: 20px;

            border-radius: 15px;

            text-align: center;

        }


        .status-shop strong {

            display: block;

            font-size: 35px;

            color:
                #764ba2;

            margin-top: 10px;

        }


        /* =========================
           ปุ่มแอดมิน
        ========================= */

        .admin-login {

            margin-top: 20px;

        }


        .admin-login a {

            display: block;

            width: 100%;

            padding: 15px;

            background:
                #2d3436;

            color: white;

            text-align: center;

            text-decoration: none;

            border-radius: 10px;

            font-size: 18px;

        }


        .admin-login a:hover {

            background:
                #1e2324;

        }


        /* =========================
           มือถือ
        ========================= */

        @media (max-width: 600px) {

            .shops,
            .status-box {

                grid-template-columns:
                    1fr;

            }

            #currentQueue {

                font-size: 50px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        🍽 ระบบจองคิวร้านอาหาร
    </h1>


    <!-- =========================
         เลือกร้าน
    ========================= -->

    <div class="shops">


        <div
            class="shop active"
            id="shopA"
            onclick="selectShop('A')"
        >

            <div class="shop-icon">
                ☕
            </div>

            <h2>
                ร้านน้ำคาเฟ่
            </h2>

            <p>
                เครื่องดื่มและของหวาน
            </p>

        </div>


        <div
            class="shop"
            id="shopB"
            onclick="selectShop('B')"
        >

            <div class="shop-icon">
                🌶️
            </div>

            <h2>
                ร้านหม่าล่า
            </h2>

            <p>
                หม่าล่าและของย่าง
            </p>

        </div>


    </div>


    <!-- =========================
         ร้านที่เลือก
    ========================= -->

    <div class="box selected">

        <h2 id="selectedShop">

            กำลังจองคิวร้านน้ำคาเฟ่

        </h2>

    </div>


    <!-- =========================
         คิวปัจจุบัน
    ========================= -->

    <div class="box current">

        <h2>
            📢 กำลังเรียกคิว
        </h2>


        <div id="currentQueue">

            A000

        </div>

    </div>


    <!-- =========================
         รับบัตรคิว
    ========================= -->

    <div class="box">

        <h2>
            📝 รับบัตรคิว
        </h2>


        <input
            type="text"
            id="name"
            placeholder="ชื่อลูกค้า"
        >


        <button
            class="book-btn"
            onclick="bookQueue()"
        >

            🎫 รับบัตรคิว

        </button>

    </div>


    <!-- =========================
         รายการคิว
    ========================= -->

    <div class="box">

        <h2>
            📋 รายการคิว
        </h2>


        <table>

            <thead>

                <tr>

                    <th>
                        คิว
                    </th>

                    <th>
                        ชื่อ
                    </th>

                </tr>

            </thead>


            <tbody
                id="queueTable"
            ></tbody>

        </table>

    </div>


    <!-- =========================
         สถานะทั้ง 2 ร้าน
    ========================= -->

    <div class="box">

        <h2>
            📊 สถานะคิวของทั้ง 2 ร้าน
        </h2>


        <br>


        <div class="status-box">


            <div class="status-shop">

                <h3>
                    ☕ ร้านน้ำคาเฟ่
                </h3>

                <p>
                    คิวปัจจุบัน
                </p>

                <strong id="statusA">
                    A000
                </strong>

            </div>


            <div class="status-shop">

                <h3>
                    🌶️ ร้านหม่าล่า
                </h3>

                <p>
                    คิวปัจจุบัน
                </p>

                <strong id="statusB">
                    B000
                </strong>

            </div>


        </div>

    </div>


    <!-- =========================
         เข้าแอดมิน
    ========================= -->

    <div class="admin-login">

        <a href="admin.html">

            🔐 เข้าสู่ระบบแอดมิน

        </a>

    </div>


</div>



<!-- =================================================
     Firebase
================================================= -->

<script type="module">


import {

    initializeApp

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

    getDatabase,
    ref,
    get,
    set,
    onValue

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



/* =================================================
   Firebase Config
================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCinwLrAnugbxn2X60C8qTqBHWNDXzHB7c",

    authDomain:
        "restaurantqueue-80705.firebaseapp.com",

    databaseURL:
        "https://restaurantqueue-80705-default-rtdb.firebaseio.com",

    projectId:
        "restaurantqueue-80705",

    storageBucket:
        "restaurantqueue-80705.firebasestorage.app",

    messagingSenderId:
        "944772230709",

    appId:
        "1:944772230709:web:8a73bee17f067c8c48cb7c",

    measurementId:
        "G-8NK846F8XE"

};



/* =================================================
   เริ่ม Firebase
================================================= */

const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getDatabase(app);



/* =================================================
   ตัวแปร
================================================= */

let selectedShop = "A";

let queueA = [];

let queueB = [];

let currentA = 0;

let currentB = 0;



/* =================================================
   สร้างเลขคิว
================================================= */

function createQueueNumber(
    shop,
    number
) {

    return (
        shop +
        String(number)
            .padStart(3, "0")
    );

}



/* =================================================
   เลือกร้าน
================================================= */

window.selectShop =
function(shop) {


    selectedShop =
        shop;


    document
        .getElementById("shopA")
        .classList
        .remove("active");


    document
        .getElementById("shopB")
        .classList
        .remove("active");



    if (shop === "A") {


        document
            .getElementById("shopA")
            .classList
            .add("active");


        document
            .getElementById("selectedShop")
            .innerText =
            "กำลังจองคิวร้านน้ำคาเฟ่";


    }

    else {


        document
            .getElementById("shopB")
            .classList
            .add("active");


        document
            .getElementById("selectedShop")
            .innerText =
            "กำลังจองคิวร้านหม่าล่า";

    }



    updateCurrent();

    showQueue();

};



/* =================================================
   รับบัตรคิว
================================================= */

window.bookQueue =
async function() {


    const name =
        document
            .getElementById("name")
            .value
            .trim();



    if (name === "") {

        alert(
            "กรุณากรอกชื่อลูกค้า"
        );

        return;

    }



    try {


        /* อ่านคิวทั้งหมด */

        const snapshot =
            await get(
                ref(
                    db,
                    "queues"
                )
            );


        const data =
            snapshot.val() || {};



        let lastNumber = 0;



        Object.values(data)
            .forEach(
                customer => {


                    if (
                        customer.shop ===
                        selectedShop
                    ) {


                        lastNumber =
                            Math.max(

                                lastNumber,

                                Number(
                                    customer.queueNumber
                                ) || 0

                            );

                    }

                }
            );



        /* เลขคิวใหม่ */

        const nextNumber =
            lastNumber + 1;



        const queueNumber =
            createQueueNumber(

                selectedShop,

                nextNumber

            );



        const id =
            "queue_" +
            Date.now();



        /* บันทึก Firebase */

        await set(

            ref(
                db,
                "queues/" + id
            ),

            {

                shop:
                    selectedShop,

                queueNumber:
                    nextNumber,

                number:
                    queueNumber,

                name:
                    name,

                status:
                    "waiting",

                createdAt:
                    Date.now()

            }

        );



        /* บันทึกข้อมูลลูกค้า */

        localStorage.setItem(

            "myQueueNumber",

            queueNumber

        );


        localStorage.setItem(

            "myQueueShop",

            selectedShop

        );


        localStorage.setItem(

            "myName",

            name

        );



        /* ล้างชื่อ */

        document
            .getElementById("name")
            .value = "";



        /* ไปหน้ารอคิว */

        window.location.href =
            "waiting.html";


    }

    catch(error) {


        console.error(error);


        alert(

            "❌ บันทึกคิวไม่สำเร็จ\n\n" +

            error.message

        );

    }

};



/* =================================================
   โหลดรายการคิว
================================================= */

function loadQueues() {


    onValue(

        ref(
            db,
            "queues"
        ),

        snapshot => {


            const data =
                snapshot.val() || {};



            queueA = [];

            queueB = [];



            Object.keys(data)
                .forEach(
                    id => {


                        const customer =
                            data[id];



                        if (
                            customer.status !==
                            "waiting"
                        ) {

                            return;

                        }



                        const item = {

                            id:
                                id,

                            ...customer

                        };



                        if (
                            customer.shop ===
                            "A"
                        ) {

                            queueA.push(item);

                        }



                        if (
                            customer.shop ===
                            "B"
                        ) {

                            queueB.push(item);

                        }

                    }
                );



            queueA.sort(

                (a,b) =>

                    a.queueNumber -
                    b.queueNumber

            );



            queueB.sort(

                (a,b) =>

                    a.queueNumber -
                    b.queueNumber

            );



            showQueue();

        }

    );

}



/* =================================================
   แสดงรายการคิว
================================================= */

function showQueue() {


    const table =
        document.getElementById(
            "queueTable"
        );


    table.innerHTML = "";



    const queue =

        selectedShop === "A"

            ? queueA

            : queueB;



    if (
        queue.length === 0
    ) {


        table.innerHTML = `

            <tr>

                <td colspan="2">

                    ยังไม่มีคิว

                </td>

            </tr>

        `;


        return;

    }



    queue.forEach(
        customer => {


            const row =
                document.createElement(
                    "tr"
                );



            row.innerHTML = `

                <td>

                    <strong>

                        ${customer.number}

                    </strong>

                </td>

                <td>

                    ${customer.name}

                </td>

            `;



            table.appendChild(row);

        }
    );

}



/* =================================================
   โหลดคิวปัจจุบัน
================================================= */

function loadCurrent() {


    onValue(

        ref(
            db,
            "current"
        ),

        snapshot => {


            const data =
                snapshot.val() || {};



            currentA =
                Number(
                    data.A?.number
                ) || 0;



            currentB =
                Number(
                    data.B?.number
                ) || 0;



            updateCurrent();

        }

    );

}



/* =================================================
   แสดงคิวปัจจุบัน
================================================= */

function updateCurrent() {


    const current =

        selectedShop === "A"

            ? currentA

            : currentB;



    document
        .getElementById(
            "currentQueue"
        )
        .innerText =

        createQueueNumber(

            selectedShop,

            current

        );



    document
        .getElementById(
            "statusA"
        )
        .innerText =

        createQueueNumber(

            "A",

            currentA

        );



    document
        .getElementById(
            "statusB"
        )
        .innerText =

        createQueueNumber(

            "B",

            currentB

        );

}



/* =================================================
   เริ่มระบบ
================================================= */

loadQueues();

loadCurrent();


</script>


</body>

</html>
