<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองคิวร้านอาหาร</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 35px;
            font-size: 32px;
        }

        .title {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }

        /* ร้านอาหาร */
        .shops {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 45px;
        }

        .shop {
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .shop:hover {
            transform: translateY(-7px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .shop h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .shop p {
            color: #777;
            font-size: 16px;
        }

        /* สถานะคิว */
        .status-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .status-shop {
            background: white;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .status-shop h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .queue-label {
            color: #777;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .queue-number {
            font-size: 45px;
            font-weight: bold;
            color: #667eea;
        }

        /* ปุ่มแอดมิน */
        .admin-area {
            text-align: center;
            margin-top: 35px;
        }

        .admin-button {
            display: inline-block;
            background: white;
            color: #333;
            padding: 12px 25px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .admin-button:hover {
            transform: translateY(-3px);
        }

        @media (max-width: 600px) {
            .shops,
            .status-container {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🍽 ระบบจองคิวร้านอาหาร</h1>

    <h2 class="title">เลือกร้านอาหาร</h2>

    <div class="shops">

        <!-- ร้านน้ำคาเฟ่ -->
        <div class="shop" onclick="goToShop('A')">
            <div class="icon">☕</div>
            <h2>ร้านน้ำคาเฟ่</h2>
            <p>เครื่องดื่มและของหวาน</p>
        </div>

        <!-- ร้านหม่าล่า -->
        <div class="shop" onclick="goToShop('B')">
            <div class="icon">🌶️</div>
            <h2>ร้านหม่าล่า</h2>
            <p>หม่าล่าและของย่าง</p>
        </div>

    </div>


    <!-- สถานะคิว -->
    <h2 class="title">📊 สถานะคิวของทั้ง 2 ร้าน</h2>

    <div class="status-container">

        <div class="status-shop">

            <h2>☕ ร้านน้ำคาเฟ่</h2>

            <div class="queue-label">
                คิวปัจจุบัน
            </div>

            <div class="queue-number" id="statusA">
                A000
            </div>

        </div>


        <div class="status-shop">

            <h2>🌶️ ร้านหม่าล่า</h2>

            <div class="queue-label">
                คิวปัจจุบัน
            </div>

            <div class="queue-number" id="statusB">
                B000
            </div>

        </div>

    </div>


    <!-- ปุ่มแอดมิน -->
    <div class="admin-area">

        <a href="admin-login.html" class="admin-button">
            🔐 เข้าสู่ระบบแอดมิน
        </a>

    </div>

</div>


<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
        getDatabase,
        ref,
        onValue
    }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    const firebaseConfig = {

        apiKey: "AIzaSyCinwLrAnugbxn2X60C8QqTQbHWNDXzHB7c",

        authDomain:
            "restaurantqueue-80705.firebaseapp.com",

        databaseURL:
            "https://restaurantqueue-80705-default-rtdb.firebaseio.com",

        projectId:
            "restaurantqueue-80705",

        storageBucket:
            "restaurantqueue-80705.firebasestorage.app",

        messagingSenderId:
            "944772230709",

        appId:
            "1:944772230709:web:8a73bee17f067c8c48cb7c",

        measurementId:
            "G-8NK846F8XE"
    };


    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);


    // กดร้าน
    window.goToShop = function(shop) {

        if (shop === "A") {

            window.location.href =
                "booking.html?shop=A";

        }

        if (shop === "B") {

            window.location.href =
                "booking.html?shop=B";

        }

    };


    // แสดงคิวปัจจุบัน
    const currentRef =
        ref(db, "current");


    onValue(currentRef, (snapshot) => {

        const data =
            snapshot.val() || {};


        let numberA = 0;

        if (
            data.A &&
            data.A.number != null
        ) {

            numberA =
                Number(data.A.number);

        }


        document.getElementById(
            "statusA"
        ).textContent =
            "A" +
            String(numberA).padStart(3, "0");


        let numberB = 0;

        if (
            data.B &&
            data.B.number != null
        ) {

            numberB =
                Number(data.B.number);

        }


        document.getElementById(
            "statusB"
        ).textContent =
            "B" +
            String(numberB).padStart(3, "0");

    });

</script>

</body>
</html>
