<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>หน้ารอคิว</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #8e44ad, #6c5ce7, #a29bfe);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    width: 430px;
    max-width: 100%;
    background: white;
    padding: 30px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,.3);
}

h1 {
    color: #6c5ce7;
    margin-bottom: 20px;
}

.queue {
    font-size: 70px;
    color: #8e44ad;
    font-weight: bold;
    margin: 15px 0;
}

.info {
    font-size: 18px;
    margin: 10px 0;
}

.current {
    margin-top: 20px;
    padding: 15px;
    border-radius: 15px;
    background: #f3e8ff;
}

.current h2 {
    color: #6c5ce7;
}

.currentQueue {
    font-size: 50px;
    color: #8e44ad;
    font-weight: bold;
    margin-top: 5px;
}

.left {
    margin-top: 15px;
    font-size: 18px;
    color: #555;
}

.status {
    margin-top: 20px;
    font-size: 24px;
    font-weight: bold;
    color: #ff9800;
}

.ready {
    color: #e74c3c;
}

.error {
    color: #e74c3c;
    margin-top: 15px;
}

.back {
    margin-top: 20px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #6c5ce7;
    color: white;
    font-size: 17px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="card">

    <h1>💜 หน้ารอคิว 💜</h1>

    <div class="queue" id="myQueue">
        กำลังโหลด...
    </div>

    <div class="info">
        👤 <b id="myName">-</b>
    </div>

    <div class="info">
        👥 จำนวนคน : <b id="myPeople">-</b>
    </div>

    <div class="current">

        <h2>📢 กำลังเรียกคิว</h2>

        <div
            class="currentQueue"
            id="currentQueue"
        >
            A000
        </div>

    </div>

    <div
        class="left"
        id="leftQueue"
    >
        กำลังตรวจสอบ...
    </div>

    <div
        class="status"
        id="status"
    >
        ⏳ กรุณารอสักครู่...
    </div>

    <div
        class="error"
        id="error"
    ></div>

    <button
        class="back"
        onclick="window.location.href='index.html'"
    >
        ← กลับหน้ารับคิว
    </button>

</div>


<script type="module">

// =========================================
// Firebase
// =========================================

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


// =========================================
// Firebase Config
// =========================================

const firebaseConfig = {

    apiKey:
        "AIzaSyCinwLrAnugbxn2X60C8qTqBHWNDXzHB7c",

    authDomain:
        "restaurantqueue-80705.firebaseapp.com",

    databaseURL:
        "https://restaurantqueue-80705-default-rtdb.firebaseio.com",

    projectId:
        "restaurantqueue-80705",

    storageBucket:
        "restaurantqueue-80705.firebasestorage.app",

    messagingSenderId:
        "944772230709",

    appId:
        "1:944772230709:web:8a73bee17f067c8c48cb7c",

    measurementId:
        "G-8NK846F8XE"
};


// =========================================
// เริ่ม Firebase
// =========================================

const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


// =========================================
// ข้อมูลคิวของลูกค้า
// =========================================

const myQueue =
    localStorage.getItem(
        "myQueueNumber"
    );

const myShop =
    localStorage.getItem(
        "myQueueShop"
    );

const myName =
    localStorage.getItem(
        "myName"
    ) || "-";

const myPeople =
    localStorage.getItem(
        "myPeople"
    ) || "-";


// =========================================
// แสดงข้อมูลเบื้องต้น
// =========================================

document.getElementById(
    "myQueue"
).innerText =
    myQueue || "-";

document.getElementById(
    "myName"
).innerText =
    myName;

document.getElementById(
    "myPeople"
).innerText =
    myPeople;


// =========================================
// ถ้าไม่มีคิว
// =========================================

if (!myQueue || !myShop) {

    document.getElementById(
        "status"
    ).innerText =
        "❌ ไม่พบข้อมูลคิว";

    document.getElementById(
        "leftQueue"
    ).innerText =
        "กรุณากลับไปรับคิวใหม่";

}


// =========================================
// เปลี่ยน A001 → 1
// =========================================

function getQueueNumber(queue) {

    if (!queue) {
        return 0;
    }

    return Number(
        queue.substring(1)
    ) || 0;

}


// =========================================
// ฟัง Firebase: คิวปัจจุบัน
// =========================================

if (myShop) {

    onValue(

        ref(
            db,
            "current/" + myShop
        ),

        snapshot => {

            const data =
                snapshot.val();


            let currentNumber = 0;


            if (
                data &&
                data.number
            ) {

                currentNumber =
                    Number(
                        data.number
                    );

            }


            const currentQueue =
                myShop +
                String(
                    currentNumber
                ).padStart(3, "0");


            document.getElementById(
                "currentQueue"
            ).innerText =
                currentQueue;


            updateStatus(
                currentNumber
            );

        },

        error => {

            console.error(error);

            document.getElementById(
                "error"
            ).innerText =
                "เชื่อมต่อ Firebase ไม่สำเร็จ";

        }

    );

}


// =========================================
// คำนวณสถานะ
// =========================================

function updateStatus(
    currentNumber
) {

    if (!myQueue) {
        return;
    }


    const myNumber =
        getQueueNumber(
            myQueue
        );


    const left =
        myNumber -
        currentNumber;


    if (left <= 0) {

        document.getElementById(
            "status"
        ).innerText =
            "🎉 ถึงคิวของคุณแล้ว";

        document.getElementById(
            "status"
        ).className =
            "status ready";


        document.getElementById(
            "leftQueue"
        ).innerHTML =
            "🔔 เชิญติดต่อพนักงาน";

    }

    else {

        document.getElementById(
            "status"
        ).innerText =
            "⏳ กรุณารอคิว";

        document.getElementById(
            "status"
        ).className =
            "status";


        document.getElementById(
            "leftQueue"
        ).innerHTML =
            "เหลืออีก <b>" +
            left +
            "</b> คิว";

    }

}


// =========================================
// ฟังสถานะคิวของตัวเอง
// =========================================

if (myQueue) {

    onValue(

        ref(
            db,
            "queues"
        ),

        snapshot => {

            const data =
                snapshot.val() || {};


            let found = false;


            Object.values(data).forEach(
                customer => {

                    if (
                        customer.number ===
                        myQueue
                    ) {

                        found = true;

                    }

                }
            );


            if (!found) {

                // ไม่ทำอะไร
                // เพราะคิวอาจถูกเรียกไปแล้ว

            }

        }

    );

}

</script>

</body>
</html>
